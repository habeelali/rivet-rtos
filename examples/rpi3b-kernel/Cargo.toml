[package]
name = "rpi3b-kernel"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Separate package from examples/rpi3b on purpose. Those binaries predate
# the kernel running on this board and deliberately link neither it nor
# the arch crate, which is what makes them valid tests of the bare
# hardware. Keeping them in another package keeps that separation from
# depending on Cargo's feature unification.
[[bin]]
name = "kernel_demo"
path = "src/bin/kernel_demo.rs"
test = false
bench = false

[[bin]]
name = "core3_demo"
path = "src/bin/core3_demo.rs"
test = false
bench = false

[[bin]]
name = "kernel_features"
path = "src/bin/kernel_features.rs"
test = false
bench = false

[[bin]]
name = "periph_test"
path = "src/bin/periph_test.rs"
test = false
bench = false

[[bin]]
name = "trace_demo"
path = "src/bin/trace_demo.rs"
test = false
bench = false

[[bin]]
name = "channel_demo"
path = "src/bin/channel_demo.rs"
test = false
bench = false

[[bin]]
name = "rt_bench"
path = "src/bin/rt_bench.rs"
test = false
bench = false

[[bin]]
name = "scope_demo"
path = "src/bin/scope_demo.rs"
test = false
bench = false

[[bin]]
name = "tick_anatomy"
path = "src/bin/tick_anatomy.rs"
test = false
bench = false

[features]
# PulseTrace live tracing, forwarded to the board crate which puts the
# frames in their own ring in the shared window.
trace = ["rivet/trace", "rivet-bsp-rpi3b/trace"]
# Per-stage timing inside the tick handler, for tick_anatomy. Diagnostic
# only: it puts counter reads on the tick path.
tick-phases = ["rivet-bsp-rpi3b/tick-phases"]

[dependencies]
rivet = { path = "../../rivet", package = "rivet-rtos" }
rivet-arch-aarch64 = { path = "../../rivet-arch-aarch64" }
rivet-bsp-rpi3b = { path = "../../rivet-bsp-rpi3b", features = ["kernel"] }
