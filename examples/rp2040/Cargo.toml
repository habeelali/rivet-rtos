[package]
name = "rp2040-demo"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "demo"
path = "src/main.rs"
test = false

[features]
latency-histograms = ["rivet/latency-histograms", "rivet-arch-cortex-m0/latency-histograms"]

[dependencies]
rivet = { path = "../../rivet" }
rivet-rt = { path = "../../rivet-rt" }
rivet-bsp-rp2040 = { path = "../../rivet-bsp-rp2040" }
# Must match rivet-bsp-rp2040's own feature selection exactly — Cargo
# unifies features across a build graph (see rivet-bsp-esp32c6's own
# Cargo.toml comment for the footgun this avoids).
rivet-arch-cortex-m0 = { path = "../../rivet-arch-cortex-m0", features = ["systick", "nvic"] }
rp2040-pac = { version = "0.6", default-features = false }

[profile.release]
opt-level = "s"
lto = true
debug = true
panic = "abort"

[profile.dev]
panic = "abort"
