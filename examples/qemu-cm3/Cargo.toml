[package]
name = "qemu-cm3"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "qemu-cm3"
test = false

[features]
# plan.md Phase 12: forwards to both crates' own `latency-histograms`
# feature (independent flags per crate, same name).
latency-histograms = ["rivet/latency-histograms", "rivet-arch-cortex-m/latency-histograms"]

[dependencies]
rivet = { path = "../../rivet" }
rivet-rt = { path = "../../rivet-rt" }
rivet-bsp-lm3s6965 = { path = "../../rivet-bsp-lm3s6965" }
# Direct dependency for one test's tick-counter seeding hook
# (soak_time_wrap); everything else in these examples only touches
# `rivet`/`rivet-bsp-lm3s6965`.
rivet-arch-cortex-m = { path = "../../rivet-arch-cortex-m", features = ["systick"] }
