[package]
name = "rpi3b-amp"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Its own package because it is built differently, not just differently
# configured: a load address well clear of Linux's kernel, and the `amp`
# feature changing the entry point. Cargo unifies features per package,
# so sharing one with the standalone demos would apply that entry to them
# too.
[[bin]]
name = "amp_demo"
path = "src/bin/amp_demo.rs"
test = false
bench = false

# The same sources as the standalone package, built for AMP instead:
# a different load address, the `amp` entry point, and the shared-memory
# console. `board_bringup` is what lets one file serve both.
[[bin]]
name = "kernel_features_amp"
path = "../rpi3b-kernel/src/bin/kernel_features.rs"
test = false
bench = false

[[bin]]
name = "periph_test_amp"
path = "../rpi3b-kernel/src/bin/periph_test.rs"
test = false
bench = false

[[bin]]
name = "trace_demo_amp"
path = "../rpi3b-kernel/src/bin/trace_demo.rs"
test = false
bench = false

[[bin]]
name = "channel_demo_amp"
path = "../rpi3b-kernel/src/bin/channel_demo.rs"
test = false
bench = false

[[bin]]
name = "rt_bench_amp"
path = "../rpi3b-kernel/src/bin/rt_bench.rs"
test = false
bench = false

[[bin]]
name = "scope_demo_amp"
path = "../rpi3b-kernel/src/bin/scope_demo.rs"
test = false
bench = false

[[bin]]
name = "tick_anatomy_amp"
path = "../rpi3b-kernel/src/bin/tick_anatomy.rs"
test = false
bench = false

[features]
# PulseTrace live tracing, forwarded to the board crate which puts the
# frames in their own ring in the shared window.
trace = ["rivet/trace", "rivet-bsp-rpi3b/trace"]
# Per-stage timing inside the tick handler, for tick_anatomy. Diagnostic
# only: it puts counter reads on the tick path.
tick-phases = ["rivet-bsp-rpi3b/tick-phases"]

[dependencies]
rivet = { path = "../../rivet", package = "rivet-rtos" }
rivet-arch-aarch64 = { path = "../../rivet-arch-aarch64" }
rivet-bsp-rpi3b = { path = "../../rivet-bsp-rpi3b", features = ["kernel", "amp"] }
