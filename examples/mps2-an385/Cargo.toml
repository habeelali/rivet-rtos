[package]
name = "mps2-an385"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "mps2-an385"
test = false

[features]
# plan.md Phase 12: forwards to both crates' own `latency-histograms`
# feature (independent flags per crate, same name).
latency-histograms = ["rivet/latency-histograms", "rivet-arch-cortex-m/latency-histograms"]

[dependencies]
rivet = { path = "../../rivet", package = "rivet-rtos" }
rivet-rt = { path = "../../rivet-rt" }
rivet-bsp-mps2-an385 = { path = "../../rivet-bsp-mps2-an385" }
rivet-arch-cortex-m = { path = "../../rivet-arch-cortex-m", features = ["systick", "nvic"] }
rivet-bsp-support = { path = "../../rivet-bsp-support" }
embedded-hal-async = "1.0"
embedded-hal-nb = "1.0"
nb = "1.1"
