[package]
name = "rivet"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rivet RTOS: zero-allocation async RTOS kernel — arch/board-independent, see docs/porting.md"

[features]
default = []
# Host port: implements the port contract (Group A + B) with no-ops/fakes
# so the kernel's own test suite (and `cargo check`/`build` on a host
# target) links and runs without a real rivet-arch-*/rivet-bsp-* crate.
# Never enabled for embedded builds — those link a real arch+board pair.
host-port = []
# Host-test support: serialized, reset-able kernel globals so `cargo test`
# is deterministic under parallel threads. Never enable this for embedded
# builds — it pulls in `std` (test harness only). Implies host-port: a
# test binary needs *some* port implementation to link.
test-support = ["host-port"]
# Permutation testing of the lock-free core (plan.md §1.3). Only ever
# enabled together with RUSTFLAGS='--cfg loom' for the loom test target.
loom = ["dep:loom"]
# Latency histograms (plan.md Phase 12): four small [AtomicU32; 16]
# tables tracking interrupt/dispatch/critical-section/scheduling latency.
# Off by default (a real cost-sensitive board shouldn't pay for it
# unasked); the QEMU example binaries enable it explicitly so the test
# suite actually exercises the instrumentation.
latency-histograms = []

[dependencies]
rivet-macros = { path = "../rivet-macros" }
loom = { version = "0.7", optional = true }

[dev-dependencies]
# Enable the test-support feature when building any test target of this
# crate (unit tests and tests/integration.rs alike).
rivet = { path = ".", features = ["test-support"] }
# Property-based testing of the scheduler/timer pure logic (Phase 1.4).
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[lib]
