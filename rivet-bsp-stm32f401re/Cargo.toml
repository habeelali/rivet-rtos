[package]
name = "rivet-bsp-stm32f401re"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rivet RTOS board support: STM32F401RE Nucleo-64 (Cortex-M4), real hardware"
# Lets this crate's build.rs publish its linker script path to direct
# dependents as DEP_RIVET_BSP_STM32F401RE_LINKER_SCRIPT (see build.rs).
links = "rivet_bsp_stm32f401re"

[dependencies]
rivet = { path = "../rivet" }
# `default-features = false`: the PAC's default `rt` feature pulls in
# `cortex-m-rt/device`, which provides its own `Reset`/vector-table
# symbols — this workspace's own `rivet-rt` already owns that (a real
# `Reset already defined` link error otherwise). Bare register access
# only, same reasoning as every other `rivet-bsp-*` PAC dependency.
stm32f4 = { version = "0.16", default-features = false, features = ["stm32f401"] }

# Cortex-M specific (real asm!/naked_asm! blocks transitively) — only
# pulled in for the actual target, matching rivet-bsp-lm3s6965's own
# split so `cargo test -p rivet-bsp-stm32f401re` still runs on host.
[target.'cfg(target_arch = "arm")'.dependencies]
rivet-arch-cortex-m = { path = "../rivet-arch-cortex-m", features = ["systick", "nvic"] }

[features]
# PulseTrace live tracing — forwards to rivet's own `trace` feature and
# implements the board-side `__rivet_board_trace_write` symbol it needs.
trace = ["rivet/trace"]

[lib]
