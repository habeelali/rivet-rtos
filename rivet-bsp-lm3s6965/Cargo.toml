[package]
name = "rivet-bsp-lm3s6965"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rivet RTOS board support: TI/Luminary LM3S6965 (Stellaris) Cortex-M3, as modeled by QEMU's lm3s6965evb"
# Lets this crate's build.rs publish its linker script path to direct
# dependents as DEP_RIVET_BSP_LM3S6965_LINKER_SCRIPT (see build.rs).
links = "rivet_bsp_lm3s6965"

[dependencies]
rivet = { path = "../rivet", version = "0.2.0", package = "rivet-rtos" }
embedded-hal = "1.0"

# Cortex-M specific (build errors on host: real asm!/naked_asm! blocks) —
# only pulled in for the actual target, so `cargo test -p rivet-bsp-lm3s6965`
# still runs the host-testable parts (the GPIO typestate compile-check)
# without needing an ARM target/runner.
[target.'cfg(target_arch = "arm")'.dependencies]
rivet-arch-cortex-m = { path = "../rivet-arch-cortex-m", version = "0.2.0", features = ["systick"] }

[lib]
