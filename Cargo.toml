[package]
name = "rivet-rtos"
version = "0.1.0"
edition = "2021"
description = "A small, preemptive RTOS for RISC-V written in Rust. ESP32-C3 target."
license = "MIT"
repository = "https://github.com/habeelali/rivet-rtos"
readme = "README.md"

[features]
default = []
esp32c3 = []

[lib]

[build-dependencies]

[dependencies]

[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv = "0.12"

[dev-dependencies]

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
debug = true
