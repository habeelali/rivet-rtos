[workspace]
members = [
    "rivet",
    "rivet-macros",
    "rivet-arch-riscv",
    "rivet-arch-cortex-m",
    "rivet-bsp-support",
    "rivet-bsp-qemu-virt",
    "rivet-bsp-lm3s6965",
    "rivet-rt",
    "examples/qemu-cm3",
    "examples/qemu-riscv",
    "xtask",
]
resolver = "2"
# cargo-fuzz crate: pinned deps + its own lockfile; built only via
# `cargo +nightly fuzz run`, never as part of workspace builds.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/habeelali/rivet-rtos"
readme = "README.md"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
debug = true
panic = "abort"

[profile.dev]
panic = "abort"

# Run the QEMU suite under both `release` and `release-checked` — kernel
# time arithmetic ([B4]/[B5]/[B6]) is exactly where silent wrapping hides,
# so the checked build is part of CI (plan.md §1.9).
[profile.release-checked]
inherits = "release"
overflow-checks = true
debug-assertions = true
