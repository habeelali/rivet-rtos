[package]
name = "rivet-bsp-rpi3b"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rivet RTOS board support: Raspberry Pi 3 Model B (BCM2837, Cortex-A53), real hardware"
# Experimental AArch64 bring-up. Not published while the port is still a
# UART-only milestone with no kernel integration (see src/lib.rs).
publish = false
# Lets this crate's build.rs publish its linker script path to direct
# dependents as DEP_RIVET_BSP_RPI3B_LINKER_SCRIPT (see build.rs).
links = "rivet_bsp_rpi3b"

[features]
default = ["panic-handler"]
# Provide a default #[panic_handler] that reports over the PL011. Binaries
# can disable this and supply their own, same as rivet-rt's flag of the
# same name.
panic-handler = []
# Implement Group B of the port contract (the __rivet_board_* symbols) and
# pull in the kernel to do it. Off by default so the standalone bring-up
# binaries, which deliberately predate the kernel running on this board,
# link nothing they do not need.
kernel = ["dep:rivet"]
# Build for running alongside another operating system: the entry point
# drops the core guard and the boot-time UART checkpoints, because the
# core that arrives is the one we were handed and the serial line belongs
# to the other side. Diagnostics go to the shared-memory ring instead.
amp = []
# PulseTrace live tracing: forwards to rivet's own `trace` feature and
# implements the board-side __rivet_board_trace_write it needs. Frames go
# to their own ring in the shared window, never the console.
trace = ["rivet/trace"]
# Time each stage of the tick handler separately. Diagnostic only: it adds
# counter reads to the tick path, inside the interval the handler reports.
tick-phases = []

[dependencies]
rivet = { path = "../rivet", version = "0.2.0", package = "rivet-rtos", optional = true }
embedded-hal = "1.0"

[lib]
