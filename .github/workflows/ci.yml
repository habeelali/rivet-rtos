name: ci

on: [push, pull_request]

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      # rivet (the kernel) is arch/board-independent and builds on host by
      # design (plan.md: the whole point of the layering split). Everything
      # else in the workspace is inherently ISA/board-specific (real
      # asm!/naked_asm! blocks transitively) and is linted under its own
      # target in the qemu job's per-target clippy step instead.
      - name: clippy (host crates)
        run: cargo clippy -p rivet -p rivet-macros -p xtask -p rivet-bsp-support --all-targets -- -D warnings
      - name: test (debug)
        run: cargo test -p rivet
      - name: test (release) # catch opt-level-dependent UB
        run: cargo test -p rivet --release
      - name: test (release-checked)
        run: cargo test -p rivet --profile release-checked

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # lib + integration tests under the interpreter; proptest is excluded
      # (its case volume is impractical under miri's ~1000x slowdown).
      - name: miri (lib)
        run: cargo +nightly miri test -p rivet --lib
      - name: miri (integration)
        run: cargo +nightly miri test -p rivet --test integration

  loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: loom models
        run: RUSTFLAGS='--cfg loom' cargo test -p rivet --features loom --test loom --release

  kani:
    # plan.md Phase 17: bounded model-checked proof (not just tested
    # against example sequences) that preempt::sched's core invariant —
    # a priority's READY_BITMAP bit is set iff its QUEUES word is
    # non-empty — holds after ready_add/ready_remove, for every possible
    # task id/priority in range, including the two-task interleaving
    # that a handful of example-based #[test]s can't exhaustively cover.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-kani
        run: cargo install kani-verifier --locked
      - name: kani setup
        run: cargo kani setup
      - name: kani proofs (preempt::sched invariant)
        run: cargo kani -p rivet --features test-support

  coverage:
    # Crate-wide is informational only (plan.md Phase 9): host-test line
    # coverage is ~49% as of this job's introduction, well under old-plan
    # §8.3's aspirational 80% floor on sched/waker/timer/sync/preempt —
    # and much of the gap is code the *QEMU* suite exercises instead
    # (fault handling, task lifecycle join/despawn, log/report, watchdog,
    # Sleep), which llvm-cov can't see here. Phase 17 adds a real gate,
    # scoped to only the modules the host suite can actually reach in
    # full: sched/waker/mutex/channel/timer were already 71-93% at Phase
    # 9's baseline, so a 70% floor on exactly those five is enforceable
    # without demanding coverage of code structurally outside this job's
    # reach.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: coverage (host suite, informational summary)
        run: cargo llvm-cov -p rivet --tests --summary-only
      - name: coverage floor (sched/waker/mutex/channel/timer, gating)
        run: |
          cargo llvm-cov -p rivet --tests --json --output-path cov.json
          python3 scripts/check-coverage-floor.py cov.json

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: fuzz sched
        run: cargo +nightly fuzz run fuzz_sched -- -max_total_time=60
      - name: fuzz waker bitmap
        run: cargo +nightly fuzz run fuzz_waker_bitmap -- -max_total_time=60
      - name: fuzz channel ring
        run: cargo +nightly fuzz run fuzz_channel_ring -- -max_total_time=60

  qemu:
    runs-on: ubuntu-latest
    strategy:
      # xtask's board registry (`cargo xtask boards`) is the source of
      # truth for which boards exist; this matrix just has to list the
      # ones CI should exercise. Adding a board (plan.md Phase 7) is one
      # more string here plus its registry entry in xtask/src/main.rs —
      # nothing else in this workflow changes.
      matrix:
        target: [riscv, cm3, mps2]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: apt deps
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc qemu-system-arm gdb-multiarch
      - uses: Swatinem/rust-cache@v2
      - name: rust targets
        run: |
          rustup target add riscv32imac-unknown-none-elf thumbv7m-none-eabi
      - name: clippy (embedded target)
        run: |
          case "${{ matrix.target }}" in
            riscv)
              cargo clippy -p rivet-arch-riscv -p rivet-bsp-qemu-virt -p rivet-rt -p qemu-riscv \
                --target riscv32imac-unknown-none-elf --release -- -D warnings
              ;;
            cm3)
              cargo clippy -p rivet-arch-cortex-m -p rivet-bsp-lm3s6965 -p rivet-rt -p qemu-cm3 \
                --target thumbv7m-none-eabi --release -- -D warnings
              ;;
            mps2)
              cargo clippy -p rivet-arch-cortex-m -p rivet-bsp-mps2-an385 -p rivet-rt -p mps2-an385 \
                --target thumbv7m-none-eabi --release -- -D warnings
              ;;
          esac
      - name: build with latency-histograms (plan.md Phase 12, off by default)
        run: |
          case "${{ matrix.target }}" in
            riscv)
              cargo build -p qemu-riscv --target riscv32imac-unknown-none-elf --release --features latency-histograms
              ;;
            cm3)
              cargo build -p qemu-cm3 --target thumbv7m-none-eabi --release --features latency-histograms
              ;;
            mps2)
              cargo build -p mps2-an385 --target thumbv7m-none-eabi --release --features latency-histograms
              ;;
          esac
      - name: smoke (release)
        run: cargo run -p xtask -- test --target ${{ matrix.target }} --suite smoke
      - name: smoke (release-checked)
        run: cargo run -p xtask -- test --target ${{ matrix.target }} --suite smoke --profile release-checked
      - name: stress
        run: cargo run -p xtask -- test --target ${{ matrix.target }} --suite stress
      - name: gdb context-switch verification
        run: cargo run -p xtask -- test --target ${{ matrix.target }} --suite gdb

  soak:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [riscv, cm3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-misc qemu-system-arm
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add riscv32imac-unknown-none-elf thumbv7m-none-eabi
      # plan.md Phase 17: --sim-hours 4 scales to a real 8200-iteration
      # spawn/join/despawn/channel/mutex soak (not a literal 4-hour
      # runtime — see `soak_smoke.rs`'s doc comment), completing in
      # minutes, not hours.
      - name: scaled soak (4h-equivalent iteration count)
        run: cargo run -p xtask -- soak --target ${{ matrix.target }} --sim-hours 4
